<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unfollow Lens</title>
    <link rel="icon" type="image/x-icon" href="assets/img/logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <script type="text/javascript" src="assets/js/script.js"></script>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/layout.css">
</head>

<body>

    <h1 style="justify-self: center;">Unfollow Lens</h1>

    <div class="upload-container">
        <div class="upload-card">
            <p>Select your Instagram followers_1.json file:</p>
            <input type="file" id="followers-input" accept=".json">
            <p id="followers-output"></p>
        </div>
        <div class="upload-card">
            <p>Select your Instagram following.json file:</p>
            <input type="file" id="following-input" accept=".json">
            <p id="following-output"></p>
        </div>
    </div>

    <p class="disclaimer">
        <small>Note: Clicking a profile link will open Instagram. Accounts that have been deleted or renamed since your
            data export may show "Page not available".</small>
    </p>
    <div id="results-output"></div>

</body>

</html>
